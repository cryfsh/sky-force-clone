workflows:
  android-build:
    name: Android Build
    environment:
      groups:
        - unity_credentials
      vars:
        UNITY_VERSION: "2022.3.25f1"
    scripts:
      - name: Build
        script: |
          /Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -quit \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod BuildScript.BuildAndroid \
            -logFile build.log
    artifacts:
      - build/**/*.apk
